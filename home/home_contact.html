<section class="contact py-5" id="contact">
  <div class="container">
    <div class="row g-5 align-items-start">

      <div class="col-md-6">
        <h2 class="section-title section-title-left mb-4">Contact Us</h2>

        <form id="contactForm" class="contact-form" novalidate>
          <div class="row g-3 mb-3">
            <div class="col-12">
              <input type="text" name="name" class="form-control contact-input" placeholder="Enter your name" required>
            </div>
            <div class="col-12">
              <input type="email" name="email" class="form-control contact-input" placeholder="Enter your email" required>
            </div>
            <div class="col-12">
              <input type="tel" name="phone" class="form-control contact-input" placeholder="Enter your contact no" required>
            </div>
          </div>

          <textarea name="message" class="form-control contact-input mb-3" placeholder="Enter your message" rows="4" required></textarea>

          <button type="submit" class="btn btn-gold d-inline-flex align-items-center gap-2">
            Send Message
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>

          <p class="form-status" id="formStatus" aria-live="polite"></p>
        </form>
      </div>

      <div class="col-md-6">
        <h2 class="section-title section-title-left mb-4">Our Location</h2>
        <div class="map-embed">
          <iframe
            title="Mr.Door location map"
            src="https://www.google.com/maps?q=Palai,Kottayam,Kerala&output=embed"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>
      </div>

    </div>
  </div>
</section>
