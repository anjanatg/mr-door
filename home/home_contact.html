<section class="contact" id="contact">
  <div class="container contact-grid">
    <div class="contact-form-wrap">
      <h2 class="section-title section-title-left">Contact Us</h2>

      <form id="contactForm" class="contact-form" novalidate>
        <div class="form-row">
          <input type="text" name="name" placeholder="Enter your name" required>
          <input type="email" name="email" placeholder="Enter your email" required>
          <input type="tel" name="phone" placeholder="Enter your contact no" required>
        </div>
        <textarea name="message" placeholder="Enter your message" rows="4" required></textarea>
        <button type="submit" class="btn btn-gold">Send Message
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <p class="form-status" id="formStatus" aria-live="polite"></p>
      </form>
    </div>

    <div class="contact-map-wrap">
      <h2 class="section-title section-title-left">Our Location</h2>
      <div class="map-embed">
        <iframe
          title="Mr.Door location map"
          src="https://www.google.com/maps?q=Palai,Kottayam,Kerala&output=embed"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>
    </div>
  </div>
</section>
